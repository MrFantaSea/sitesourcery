# PUBLICATION_HOLD — candidate drop-in only. Do not install.

[Unit]
After=sitesourcery-tenant.service
Requires=sitesourcery-tenant.service
ConditionPathExists=/etc/sitesourcery/PUBLICATION_APPROVED
ConditionPathExists=!/etc/sitesourcery/PUBLICATION_HOLD

[Service]
EnvironmentFile=/etc/sitesourcery/caddy.env
