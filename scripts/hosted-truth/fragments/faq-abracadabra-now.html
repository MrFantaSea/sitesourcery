      <details id="abracadabra-now" data-faq-anchor="abracadabra-now"><summary>What does Abracadabra cost?</summary><p>Building and testing a one-page preview is free. Downloading the HTML file costs $20 once per saved project. You can change and host that file anywhere. If the same project later moves to Alakazam hosting, the $20 becomes a one-time credit on its first Alakazam bill.</p></details>
